[project]
name = "atlas-sdk"
version = "0.1.0"
description = "Experimental Python SDK for the MongoDB Atlas Admin API"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.21.0",
    "pydantic>=2.0.0",
    "typing-extensions>=4.0.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pyyaml>=6.0.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/atlas_sdk", "src/mongodb_atlas"]

[tool.pytest.ini_options]
testpaths = ["tests"]
