# yaml-language-server: $schema=https://schema.buildwithfern.dev/generators-yml.json
api:
  specs:
    - openapi: ../openapi/atlas-api-filtered.yaml
default-group: local
groups:
  local:
    generators:
      - name: fernapi/fern-python-sdk
        version: 5.12.1
        output:
          location: local-file-system
          path: ../src/atlas_sdk
        config:
          package_name: atlas_sdk
          client_class_name: AtlasClient
